<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FingerprintFog Local Test</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        padding: 32px;
        background: Canvas;
        color: CanvasText;
      }

      main {
        max-width: 980px;
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }

      .actions {
        display: flex;
        gap: 12px;
        margin: 20px 0;
      }

      button {
        min-height: 40px;
        padding: 0 14px;
        border: 1px solid color-mix(in srgb, CanvasText 25%, Canvas);
        border-radius: 6px;
        background: ButtonFace;
        color: ButtonText;
        cursor: pointer;
      }

      pre {
        overflow: auto;
        padding: 16px;
        border: 1px solid color-mix(in srgb, CanvasText 18%, Canvas);
        border-radius: 6px;
        background: color-mix(in srgb, CanvasText 6%, Canvas);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>FingerprintFog Local Test</h1>
      <p>Open this page normally, then reload it after enabling the extension. Changed values mean browser-exposed APIs are being patched.</p>
      <div class="actions">
        <button type="button" id="refresh">Refresh fingerprint</button>
        <button type="button" id="copy">Copy JSON</button>
      </div>
      <pre id="output"></pre>
    </main>

    <script>
      const hashText = async (text) => {
        const bytes = new TextEncoder().encode(text);
        const digest = await crypto.subtle.digest("SHA-256", bytes);
        return [...new Uint8Array(digest)]
          .map((byte) => byte.toString(16).padStart(2, "0"))
          .join("");
      };

      const getCanvasHash = async () => {
        const canvas = document.createElement("canvas");
        canvas.width = 320;
        canvas.height = 80;
        const context = canvas.getContext("2d");
        context.textBaseline = "top";
        context.fillStyle = "#f4f1de";
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.fillStyle = "#3d405b";
        context.font = "18px Arial";
        context.fillText("FingerprintFog canvas sample 123", 12, 18);
        context.strokeStyle = "#e07a5f";
        context.beginPath();
        context.arc(250, 35, 22, 0, Math.PI * 2);
        context.stroke();
        return hashText(canvas.toDataURL());
      };

      const getWebGL = () => {
        const canvas = document.createElement("canvas");
        const gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
        if (!gl) {
          return { supported: false };
        }

        const debugInfo = gl.getExtension("WEBGL_debug_renderer_info");
        return {
          supported: true,
          vendor: gl.getParameter(gl.VENDOR),
          renderer: gl.getParameter(gl.RENDERER),
          unmaskedVendor: debugInfo ? gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL) : null,
          unmaskedRenderer: debugInfo ? gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL) : null
        };
      };

      const collectFingerprint = async () => ({
        fog: window.__fingerprintfog || null,
        userAgent: navigator.userAgent,
        platform: navigator.platform,
        language: navigator.language,
        languages: navigator.languages,
        hardwareConcurrency: navigator.hardwareConcurrency,
        deviceMemory: navigator.deviceMemory,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        timezoneOffset: new Date().getTimezoneOffset(),
        screen: {
          width: screen.width,
          height: screen.height,
          availWidth: screen.availWidth,
          availHeight: screen.availHeight,
          colorDepth: screen.colorDepth,
          pixelDepth: screen.pixelDepth
        },
        canvasHash: await getCanvasHash(),
        webgl: getWebGL()
      });

      const render = async () => {
        const fingerprint = await collectFingerprint();
        document.querySelector("#output").textContent = JSON.stringify(fingerprint, null, 2);
      };

      document.querySelector("#refresh").addEventListener("click", render);
      document.querySelector("#copy").addEventListener("click", async () => {
        await navigator.clipboard.writeText(document.querySelector("#output").textContent);
      });

      render();
    </script>
  </body>
</html>
